name: Release
on:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'samsulrifai/mihon_sync'
    name: Build & Release
    runs-on: 'ubuntu-26.04'

    steps:
      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Telemetry needs a google-services.json this fork doesn't have
      - name: Build
        run: ./gradlew assembleRelease -Pdist=github -Pinclude-telemetry=false
        env:
          storeFile: ${{ runner.temp }}/release.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          tag=${{ steps.tag.outputs.tag }}
          mv app/build/outputs/apk/release/app-universal-release.apk mihon-sync-$tag.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk mihon-sync-arm64-v8a-$tag.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk mihon-sync-armeabi-v7a-$tag.apk
          mv app/build/outputs/apk/release/app-x86-release.apk mihon-sync-x86-$tag.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk mihon-sync-x86_64-$tag.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mihon Sync ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            > [!TIP]
            >
            > ### Kalau ragu pilih yang mana, unduh `mihon-sync-arm64-v8a-${{ steps.tag.outputs.tag }}.apk`
          files: |
            mihon-sync-${{ steps.tag.outputs.tag }}.apk
            mihon-sync-arm64-v8a-${{ steps.tag.outputs.tag }}.apk
            mihon-sync-armeabi-v7a-${{ steps.tag.outputs.tag }}.apk
            mihon-sync-x86-${{ steps.tag.outputs.tag }}.apk
            mihon-sync-x86_64-${{ steps.tag.outputs.tag }}.apk
          # Published by hand after reviewing the notes, which is also when the app starts offering the update
          draft: true
          prerelease: false
